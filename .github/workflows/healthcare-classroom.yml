name: Healthcare classroom

on:
  push:
    paths:
      - apps/healthcare/**
      - apps/frontend/preview/**
      - apps/frontend/src/frontend/facade.py
      - apps/frontend/src/frontend/floor_plan.py
      - apps/frontend/src/frontend/styles/scene.css
      - packages/contracts/src/restaurant_contracts/**
      - infra/Dockerfile.healthcare-agentops*
      - .github/workflows/healthcare-classroom.yml
  pull_request:
    paths:
      - apps/healthcare/**
      - apps/frontend/preview/**
      - apps/frontend/src/frontend/facade.py
      - apps/frontend/src/frontend/floor_plan.py
      - apps/frontend/src/frontend/styles/scene.css
      - packages/contracts/src/restaurant_contracts/**
      - infra/Dockerfile.healthcare-agentops*
      - .github/workflows/healthcare-classroom.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r apps/healthcare/requirements.txt
      - run: python -m unittest discover -s apps/healthcare -p "test_*.py" -v
