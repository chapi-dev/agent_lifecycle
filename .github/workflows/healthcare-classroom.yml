name: Healthcare classroom

on:
  push:
    paths:
      - apps/healthcare/**
      - .github/workflows/healthcare-classroom.yml
  pull_request:
    paths:
      - apps/healthcare/**
      - .github/workflows/healthcare-classroom.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s apps/healthcare -p "test_*.py" -v
